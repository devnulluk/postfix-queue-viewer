services:
  queue-viewer:
    build:
      context: .
    container_name: postfix-queue-viewer
    restart: unless-stopped

    ports:
      - "100.84.54.3:8085:8080"

    environment:
      APP_TITLE: "Emergency Mail Queue"
      TZ: "Europe/London"

    volumes:
      - postfix-queue:/var/spool/postfix:ro

volumes:
  postfix-queue:
    external: true
    name: smtp-relay_postfix-queue
